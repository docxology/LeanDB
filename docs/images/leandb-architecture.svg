<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="753" viewBox="32 146 1376 753" role="img" aria-labelledby="title desc">
  <title id="title">LeanDB architecture: rich Lean types, ordinary SQL storage</title>
  <desc id="desc">The Lean compiler checks the application's domain types and typed queries. LeanDB translates supported query expressions to SQL and encodes domain values into columns. SQLite stores and queries the data. Returned rows pass through decoding and domain validation, followed by the original Lean query predicate. Valid typed results return to the application; invalid data produces a validation error.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #18242c; }
      .muted { fill: #58656b; }
      .section { font-size: 25px; font-weight: 600; }
      .body { font-size: 21px; }
      .small { font-size: 18px; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 19px; }
      .out { fill: none; stroke: #5063a4; stroke-width: 2.5; marker-end: url(#out-arrow); }
      .back { fill: none; stroke: #227b69; stroke-width: 2.5; marker-end: url(#back-arrow); }
    </style>
    <marker id="out-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#5063a4"/></marker>
    <marker id="back-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#227b69"/></marker>
    <marker id="error-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="#a85543"/></marker>
  </defs>

  <rect x="32" y="146" width="1376" height="753" fill="#fafaf8"/>

  <!-- Compile-time checks cover the Lean model and typed API. -->
  <rect x="56" y="162" width="888" height="62" rx="10" fill="#edf0f9"/>
  <path d="M80 192l7 7 13-15" fill="none" stroke="#5063a4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="114" y="201" font-size="20" font-weight="600">Lean compiler</text>
  <text x="276" y="201" font-size="20">Checks domain types, query inputs and result types</text>
  <text x="1134" y="201" class="small muted">Data checked at runtime</text>

  <text x="56" y="281" class="section">Lean application</text>
  <text x="506" y="281" class="section">LeanDB</text>
  <text x="1134" y="281" class="section">SQL backend</text>

  <!-- Application: model and requests above; typed results below. -->
  <rect x="56" y="310" width="300" height="222" rx="12" fill="#fff" stroke="#ced4d6" stroke-width="1.5"/>
  <text x="80" y="350" class="body" font-weight="600">Domain model</text>
  <text x="80" y="384" class="mono">LatteOrder · ShotCount</text>
  <text x="80" y="418" class="small muted">Fields, relationships, rules</text>
  <path d="M80 442H332" stroke="#e1e4e5"/>
  <text x="80" y="474" class="body" font-weight="600">Typed operations</text>
  <text x="80" y="508" class="small muted">select · insert · update · delete</text>

  <rect x="56" y="592" width="300" height="170" rx="12" fill="#edf6f2" stroke="#b8d4c9" stroke-width="1.5"/>
  <text x="80" y="635" class="body" font-weight="600">Typed results</text>
  <text x="80" y="672" class="body">Validated domain values</text>
  <text x="80" y="708" class="small muted">Result types follow the query</text>
  <text x="80" y="737" class="small muted">and its selected tables</text>

  <!-- Outbound SQL translation and value encoding. -->
  <rect x="506" y="310" width="438" height="222" rx="12" fill="#f0f2fa" stroke="#c8cfe4" stroke-width="1.5"/>
  <text x="534" y="350" class="body" font-weight="600">Translate queries</text>
  <text x="534" y="385" class="body muted">Supported expressions → SQL</text>
  <path d="M534 417H916" stroke="#d8deee"/>
  <text x="534" y="457" class="body" font-weight="600">Encode values</text>
  <text x="534" y="492" class="body muted">Domain values → SQL columns</text>

  <path d="M356 421H506" class="out"/>
  <text x="431" y="382" text-anchor="middle" class="small muted">Typed</text>
  <text x="431" y="405" text-anchor="middle" class="small muted">requests</text>
  <path d="M944 421H1134" class="out"/>
  <text x="1039" y="382" text-anchor="middle" class="small muted">SQL + bound</text>
  <text x="1039" y="405" text-anchor="middle" class="small muted">parameters</text>

  <!-- Ordinary physical store. -->
  <path d="M1134 352C1134 308 1384 308 1384 352V694C1384 738 1134 738 1134 694Z" fill="#fff" stroke="#9ba9af" stroke-width="1.5"/>
  <ellipse cx="1259" cy="352" rx="125" ry="33" fill="#f0f2f1" stroke="#9ba9af" stroke-width="1.5"/>
  <text x="1259" y="472" text-anchor="middle" font-size="28" font-weight="600">SQL database</text>
  <text x="1259" y="510" text-anchor="middle" class="body muted">SQLite today</text>
  <path d="M1180 540H1338" stroke="#d9dfe0"/>
  <text x="1259" y="582" text-anchor="middle" class="body muted">Tables · indexes</text>
  <text x="1259" y="618" text-anchor="middle" class="body muted">Storage · execution</text>

  <!-- The read boundary is explicit: data may fail to decode. -->
  <rect x="506" y="592" width="438" height="170" rx="12" fill="#edf6f2" stroke="#b8d4c9" stroke-width="1.5"/>
  <text x="534" y="635" class="body" font-weight="600">Decode + validate</text>
  <text x="534" y="672" class="body muted">SQL columns → domain values</text>
  <text x="534" y="708" class="small muted">Check domain rules, then apply</text>
  <text x="534" y="737" class="small muted">the original Lean query predicate</text>
  <path d="M1134 671H944" class="back"/>
  <text x="1039" y="650" text-anchor="middle" class="small muted">Stored rows</text>
  <path d="M506 671H356" class="back"/>
  <text x="431" y="632" text-anchor="middle" class="small muted">Valid</text>
  <text x="431" y="655" text-anchor="middle" class="small muted">values</text>

  <path d="M725 762V819" fill="none" stroke="#a85543" stroke-width="2" marker-end="url(#error-arrow)"/>
  <text x="744" y="798" class="small muted">Invalid data</text>
  <rect x="568" y="820" width="314" height="55" rx="9" fill="#faefea" stroke="#e0c2b9"/>
  <text x="725" y="855" text-anchor="middle" class="body" font-weight="600" style="fill:#8f4939">Validation error</text>
  <text x="1134" y="788" class="small muted">Existing databases pass</text>
  <text x="1134" y="816" class="small muted">through the same validation.</text>

</svg>
